        /**
         * ============================================================================

         * ============================================================================

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastText').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2400);
        }

        function copyToClipboard(text) {
            try {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('话术/报告已复制，可直接粘贴发送');
            } catch (err) {
                showToast('复制失败，请手动长按选择文本');
            }
        }

        function openModal(titleHtml, bodyHtml, footerHtml) {
            document.getElementById('modalTitle').innerHTML = titleHtml;
            document.getElementById('modalBody').innerHTML = bodyHtml;
            document.getElementById('modalFooter').innerHTML = footerHtml;
            document.getElementById('modalOverlay').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.add('hidden');
        }

        function getFollowUpStage(day) {
            if (day <= 1) {
                return {
                    stage: '首次接触 (D1建档期)',
                    freq: '建档当日完成评估与宣教',
                    badgeColor: 'bg-indigo-100 text-indigo-700',
                    focus: '核查FPG/HbA1c/eGFR、评估高危因素、发放关爱包及血糖仪演示'
                };
            } else if (day <= 7) {
                return {
                    stage: `第1周 (D${day}/7 · 高发窗口)`,
                    freq: '每3天随访1次 (D1-7)',
                    badgeColor: 'bg-rose-100 text-rose-700',
                    focus: '伊那利塞高血糖中位发生时间7天！主动致电获取FPG，筛查早期口腔炎'
                };
            } else if (day <= 28) {
                return {
                    stage: `第2-4周 (D${day}/28)`,
                    freq: '每周随访1次 (若Grade 2加密至每2-3天)',
                    badgeColor: 'bg-amber-100 text-amber-800',
                    focus: 'D13口腔炎/D15腹泻中位高发期；D15提醒复查血常规(警惕中性粒细胞减少)'
                };
            } else if (day <= 90) {
                return {
                    stage: `第2-3月 (D${day} · C${Math.ceil(day/28)})`,
                    freq: '每2周随访1次 (M2-M3)',
                    badgeColor: 'bg-teal-100 text-teal-800',
                    focus: 'D29皮疹中位发生期；满3月提醒复查HbA1c及肾功能，评估治疗依从性'
                };
            } else {
                return {
                    stage: `第4月及以后 (D${day} · C${Math.ceil(day/28)})`,
                    freq: '每28天(4周)随访1次',
                    badgeColor: 'bg-slate-100 text-slate-700',
                    focus: '保住治疗持续时间(DOT)，每3个月复查HbA1c与肾功能以调整降糖方案'
                };
            }
        }

        function switchTab(tabName) {
            state.currentTab = tabName;
            state.selectedPatientId = null;

            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('text-medical-700', 'font-semibold');
                el.classList.add('text-slate-400');
            });
            const activeNav = document.getElementById(`nav-${tabName}`);
            if (activeNav) {
                activeNav.classList.remove('text-slate-400');
                activeNav.classList.add('text-medical-700', 'font-semibold');
            }

            document.getElementById('backBtn').classList.add('hidden');
            document.getElementById('bottomNav').classList.remove('hidden');

            renderView();
        }

        function openPatientDetail(patientId) {
            state.selectedPatientId = patientId;
            document.getElementById('backBtn').classList.remove('hidden');
            document.getElementById('bottomNav').classList.add('hidden');
            renderPatientDetailView(patientId);
        }

        function changePatientDose(patientId, newDose) {
            const p = patients.find(item => item.id === patientId);
            if (!p) return;
            p.status = 'active';
            p.currentDose = newDose;
            p.fpgHistory.push({
                day: `D${p.dayOnDrug}(剂量调整)`,
                fpg: p.latestFPG,
                note: `按医嘱调整伊那利塞剂量为 ${newDose}mg qd`
            });
            showToast(`已将患者剂量更新为 ${newDose}mg qd`);
            renderPatientDetailView(patientId);
        }

        function pausePatientDrug(patientId) {
            const p = patients.find(item => item.id === patientId);
            if (!p) return;
            p.status = 'paused';
            p.urgentAlert = true;
            p.alertReason = '伊那利塞暂停用药中，需密切监测恢复阈值';
            p.fpgHistory.push({
                day: `D${p.dayOnDrug}(暂停用药)`,
                fpg: p.latestFPG,
                note: '执行暂停伊那利塞，提醒停药后血糖可能快速下降防低血糖'
            });
            showToast('已标记为暂停用药状态');
            renderPatientDetailView(patientId);
        }

        function updatePatientFpg(patientId) {
            const val = parseFloat(document.getElementById('newFpgInput').value);
            if (isNaN(val) || val <= 0 || val > 50) {
                showToast('请输入有效的空腹血糖数值 (mmol/L)');
                return;
            }
            const p = patients.find(item => item.id === patientId);
            p.latestFPG = val;
            let note = '正常达标，维持原方案';
            if (val > 13.9) {
                p.urgentAlert = true;
                p.status = 'paused';
                p.alertReason = `Grade 3+严重高血糖 (${val} mmol/L)，已触发暂停预警`;
                p.nextFollowUp = '今日立即就医 + 24h跟进';
                note = `Grade 3+严重升高 (${val})，触发暂停伊那利塞并紧急通知医生`;
            } else if (val > 8.9) {
                p.urgentAlert = true;
                p.alertReason = `FPG ${val} mmol/L (Grade 2)，需加密随访`;
                p.nextFollowUp = '每2-3天1次 (加密随访)';
                note = `Grade 2中度升高 (${val})，启动饮食强化并通知医生评估降糖药`;
            } else {
                p.urgentAlert = false;
                p.alertReason = '';
                note = `FPG ${val} mmol/L，控制在目标范围内`;
            }

            p.fpgHistory.push({
                day: `D${p.dayOnDrug}(最新录入)`,
                fpg: val,
                note: note
            });

            showToast(`已更新FPG为 ${val} mmol/L，决策树已刷新`);
            renderPatientDetailView(patientId);
        }

        function evaluateIntakeRisk() {
            const age = parseFloat(document.getElementById('inAge')?.value || 0);
            const bmi = parseFloat(document.getElementById('inBmi')?.value || 0);
            const egfr = parseFloat(document.getElementById('inEgfr')?.value || 90);
            const hba1c = parseFloat(document.getElementById('inHba1c')?.value || 5.0);
            const fpg = parseFloat(document.getElementById('inFpg')?.value || 5.0);

            const detectedFactors = [];
            if (age >= 45) detectedFactors.push(`年龄≥45岁 (${age}岁)`);
            if (bmi >= 28) detectedFactors.push(`BMI≥28 kg/m² 中国肥胖标准 (${bmi})`);
            if (hba1c >= 5.7) detectedFactors.push(`HbA1c≥5.7% 糖尿病前期 (${hba1c}%)`);
            if (fpg >= 6.1) detectedFactors.push(`基线空腹血糖受损 (${fpg} mmol/L)`);

            document.querySelectorAll('.risk-chk:checked').forEach(chk => {
                detectedFactors.push(chk.value);
            });

            const isHighRisk = detectedFactors.length >= 1;
            const recDose = (egfr >= 30 && egfr < 60) ? 6 : (egfr < 30 ? 0 : 9);

            const card = document.getElementById('intakeResultCard');
            if (!card) return { isHighRisk, detectedFactors, recDose };

            card.className = `rounded-2xl p-4 border ${isHighRisk ? 'bg-amber-50 border-amber-300' : 'bg-emerald-50 border-emerald-200'} space-y-2.5`;
            card.innerHTML = `
                <div class="flex justify-between items-center gap-2">
                    <span class="font-bold text-sm ${isHighRisk ? 'text-amber-900' : 'text-emerald-900'}">
                        ${isHighRisk ? '⚠️ 评估结果：高血糖高风险人群' : '✅ 评估结果：高血糖常规风险人群'}
                    </span>
                    <span class="px-2.5 py-0.5 rounded-full text-xs font-bold shrink-0 ${recDose === 6 ? 'bg-amber-600 text-white' : recDose === 0 ? 'bg-rose-600 text-white' : 'bg-medical-600 text-white'}">
                        推荐起始剂量: ${recDose === 0 ? '重度肾损慎用' : recDose + 'mg qd'}
                    </span>
                </div>

                ${egfr >= 30 && egfr < 60 ? `
                    <div class="bg-white/90 p-2 rounded-xl text-xs text-amber-800 border border-amber-200 font-medium">
                        <i class="fas fa-kidneys mr-1"></i><b>说明书肾功能剂量提示：</b>中度肾功能损害 (eGFR 30至&lt;60 mL/min) 患者，伊那利塞推荐起始剂量为 <b>6mg</b>（2片3mg）每日一次！
                    </div>
                ` : ''}

                <div class="text-xs ${isHighRisk ? 'text-amber-900' : 'text-emerald-800'} leading-relaxed">
                    ${isHighRisk ? `
                        <div class="font-semibold mb-1">命中危险因素 (${detectedFactors.length}项)：${detectedFactors.join('、')}</div>
                        <div class="bg-white/80 p-2.5 rounded-xl border border-amber-200/80 space-y-1">
                            <div>💊 <b>共识预防策略：</b>针对高风险患者，建议与临床医生沟通，可于<b>第1周期第1天 (C1D1) 预防性使用二甲双胍</b>！</div>
                            <div>🩸 <b>强化监测频率：</b>除常规第1周每3天监测外，建议高危患者每日1次空腹自我血糖监测。</div>
                        </div>
                    ` : `
                        <div>未发现关键高血糖危险因素。按常规日程表监测空腹血糖：<b>第1周每3天1次 → 第2-4周每周1次 → 第5-12周每2周1次 → 此后每4周1次</b>。</div>
                    `}
                </div>
            `;
            return { isHighRisk, detectedFactors, recDose };
        }

        function saveNewPatient() {
            const name = document.getElementById('inName').value.trim();
            if (!name) {
                showToast('请填写患者姓名');
